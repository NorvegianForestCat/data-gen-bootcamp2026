name: Build Release Binary

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e11552328562b26158080c704c2459a579862 # stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-binary
          path: target/release/dota-data-generator

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download binary artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab780b90b8802a11fb # v4.2.1
        with:
          name: release-binary
          path: dist

      - name: Make binary executable
        run: chmod +x dist/dota-data-generator

      - name: Attest binary provenance
        uses: actions/attest-build-provenance@c074443f1aab8d49d811021b0e2209687ed6e574 # v2.2.3
        with:
          subject-path: dist/dota-data-generator

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        id: push_image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/norvegianforestcat/data-gen-bootcamp2026:latest
            ghcr.io/norvegianforestcat/data-gen-bootcamp2026:${{ steps.get_version.outputs.VERSION }}

      - name: Attest Docker image provenance
        uses: actions/attest-build-provenance@c074443f1aab8d49d811021b0e2209687ed6e574 # v2.2.3
        with:
          subject-name: ghcr.io/norvegianforestcat/data-gen-bootcamp2026
          subject-digest: ${{ steps.push_image.outputs.digest }}
          push-to-registry: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          name: Release ${{ steps.get_version.outputs.VERSION }}
          files: dist/dota-data-generator
          generate_release_notes: true
