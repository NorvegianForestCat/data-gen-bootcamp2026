[package]
name = "dota-data-generator"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
sqlx = { version = "0.9.1", features = ["runtime-tokio", "postgres", "chrono"] }
mongodb = "3.10.2"
bson = "2.0.0"
rand = "0.8.0"
rand_chacha = "0.3.0"
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "1.2.2+spec-1.1.0"
chrono = { version = "0.4", features = ["serde"] }